# worldmonitor 分区 → 关键词映射
# 用途：仅用于「归类与查漏」——检索结果先按此映射归入分区，再按 SPEC.md 的条数与排序口径取舍。
# 口径唯一真相源是 SPEC.md；本文件与 SPEC.md 冲突时，以 SPEC.md 为准。

order: 4  # 四分区口径。若此处出现 order >= 5 或更多分区，即为旧五板块口径复活，须回改

sections:
  - id: politics
    name: 国内外时政
    keywords:
      - 政策发布, 政策落地, 外交, 会晤, 地缘局势, 重大公共事务
      - 国际组织, 制裁, 峰会, 选举, 条约, 领事, 主权议题

  - id: society
    name: 社会民生
    keywords:
      - 天气预警, 暴雨, 台风, 地震, 灾害预警, 应急响应
      - 就业, 失业率, 教育政策, 高考, 医保, 养老
      - 物价, 公共服务, 民生政策, 住房保障

  - id: tech_ai
    name: AI 与前沿科技
    keywords:
      - 大模型, 基础模型, AI 应用落地, 智能体, 推理模型
      - 芯片, 半导体, 制程, 量子计算, 超算
      - 航空航天, 卫星, 载人航天, 生物医疗, 创新药, 新能源技术
      - 开源, GitHub, Release, 开源公告
    fixed_subblock: 开源   # 嵌在本分区末尾，0–2 条，门槛与排除项见 SPEC.md §3.5

  - id: economy
    name: 全球经济与产业
    keywords:
      - 宏观数据, GDP, CPI, PMI, 货币政策, 美联储, 央行, 降息, 加息
      - 美股, A股, 港股, 油价, 金价, 汇率, 国债收益率
      - 行业政策, 反垄断, 关税, 财报, 头部企业经营动态, 融资
    fixed_footer: 以上信息与观点不构成投资建议   # 固定在分区末尾，见 SPEC.md §3.4
